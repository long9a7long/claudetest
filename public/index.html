<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Cart Calculator</h1>
    <section id="card" class="card">
      <form id="calc-form" novalidate>
        <div class="field">
          <label for="price">Price</label>
          <input id="price" name="price" type="text" inputmode="decimal" autocomplete="off">
          <p id="price-error" class="field-error" aria-live="off"></p>
        </div>
        <div class="field">
          <label for="quantity">Quantity</label>
          <input id="quantity" name="quantity" type="text" inputmode="numeric" autocomplete="off">
          <p id="quantity-error" class="field-error" aria-live="off"></p>
        </div>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Calculate</button>
          <button type="button" id="clear" class="btn btn-secondary">Clear</button>
        </div>
      </form>
      <section id="results" class="results" aria-live="polite" hidden>
        <dl class="results-list">
          <div class="results-row">
            <dt>Subtotal</dt>
            <dd id="result-subtotal" class="result-amount">0.00</dd>
          </div>
          <div class="results-row results-row-discount">
            <dt>Discount</dt>
            <dd id="result-discount" class="result-amount result-amount-discount">0.00</dd>
            <p id="discount-note" class="discount-note"></p>
          </div>
          <div class="results-row results-row-total">
            <dt>Total</dt>
            <dd id="result-total" class="result-amount result-amount-total">0.00</dd>
          </div>
        </dl>
        <p id="savings" class="savings" hidden></p>
        <p id="threshold-hint" class="hint" hidden></p>
      </section>
    </section>
  </main>
  <script src="calc.js"></script>
  <script src="app.js"></script>
</body>
</html>
